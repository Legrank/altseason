services:
  backend:
    build:
      context: .
      target: backend
    image: altseason-backend:latest
    restart: unless-stopped
    env_file:
      - path: backend/.env.local
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
    volumes:
      - altseason-data:/app/backend/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      target: frontend
    image: altseason-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:8081:80

volumes:
  altseason-data:
    name: altseason-data
